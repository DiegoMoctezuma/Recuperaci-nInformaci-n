# Plantilla de proyecto.yaml. Cópiala a la raíz del repositorio como proyecto.yaml y reemplaza cada <...>.
# Las skills de este pipeline leen de aquí todo lo que depende del corpus; no lo escriben en el código.
# Los conteos que no conozcas déjalos en null: se llenan después de las etapas eda_raw y limpieza.

proyecto:
  nombre: <identificador-sin-espacios>     # aparece en estado/progreso.json
  titulo: <Título del proyecto>
  nombre_corto: <Nombre corto>             # pie de diapositivas y créditos
  equipo: <Nombre del equipo>
  materia: <Materia>
  entorno_conda: <nombre-del-entorno>
  python: "3.11"
  semilla: 42

datos:
  descripcion: <qué contiene el corpus, en una línea>
  url: <URL directa al archivo>             # o null si se usa una copia local en ruta_raw
  repo_respaldo: null                       # URL .git que se clona si falla la descarga
  archivo_en_repo: null                     # ruta del archivo dentro de repo_respaldo
  ruta_raw: data/raw/<archivo>.csv
  tamano_minimo_bytes: 1000                 # si el archivo ya existe y supera esto, no se descarga
  columna_texto: <nombre de la columna con el texto>
  columna_categoria: <nombre de la columna con la categoría>
  filas_esperadas: null
  categorias: null                          # {categoria: documentos esperados, ...}
  duplicados_esperados: null
  idioma: es                                # código de idioma de spaCy: es, en, fr, pt, ...
  notas: >-
    <particularidades del texto: viene en minúsculas, trae título separado, etc.>

limpieza:
  modelo_spacy: es_core_news_sm             # inglés: en_core_web_sm
  stemmer: snowball                         # porter solo para inglés
  caracteres_permitidos: "a-záéíóúñü"       # inglés: "a-z'"
  simbolos_a_espacio: ["-", "/"]            # se cambian por espacio antes de borrar el resto
  stopwords_extra: []                       # muletillas frecuentes del dominio
  longitud_minima_token: 3
  min_tokens_documento: 20
  palabras_titulo: 8
  filas_limpias: null                       # {min: ..., max: ...}
  palabras_prohibidas: [de, la, que]        # stopwords comunes que no deben quedar en los tokens
  prueba: null                              # {entrada: "texto de prueba", salida: [tokens, esperados]}

eda:
  paleta_categorias: null                   # {categoria: "#hex", ...}; si es null se asigna una
  simbolos_a_contar: ["$", "%", "-"]
  zipf: {rango_ajuste: [1, 1000], s_min: 0.6, s_max: 1.5}
  heaps: {paso_tokens: 5000, beta_min: 0.3, beta_max: 0.8, beta_tipico: [0.4, 0.7], r2_min: 0.9}

indices:
  consultas_prueba:                         # 3 consultas temáticas con su categoría esperada
    - {query: <consulta>, categoria: <categoria>}
  sanidad: {query: <consulta muy clara>, metodo: bm25, k: 5, categoria: <categoria>, minimo: 3}
  consulta_rango: <consulta>                # debe devolver al menos 10 documentos

evaluacion:
  auto_por_categoria: 20
  consultas_manuales:                       # mismo número por categoría (se recomiendan 3)
    <categoria>: [<consulta 1>, <consulta 2>, <consulta 3>]

presentacion:
  unidad: documentos                        # cómo se nombra a los documentos: noticias, reseñas, tuits...
  categorias_es: null                       # {categoria: nombre para mostrar}
  colores_categorias: null                  # {categoria: "#hex"}
