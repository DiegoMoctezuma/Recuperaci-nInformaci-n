# Verificaciones por etapa. bloqueante: true => si falla, la etapa es FAIL.
# Genérico: todo lo que depende del corpus se lee de proyecto.yaml, disponible como `cfg`
# en las verificaciones de tipo python (src/ ya está en sys.path).

setup:
  - {id: S1, tipo: archivo_existe, ruta: requirements.txt, bloqueante: true, desc: "requirements.txt existe"}
  - {id: S2, tipo: archivo_existe, ruta: .gitignore, bloqueante: true, desc: ".gitignore existe"}
  - {id: S3, tipo: python, expr: "'data/raw/' in open('.gitignore').read()", bloqueante: true, desc: "data/raw ignorado por git"}
  - {id: S4, tipo: python, expr: "all(__import__(m) for m in ['sklearn', 'rank_bm25', 'gensim', 'wordcloud', 'pptx']) and __import__('spacy').load(cfg['limpieza']['modelo_spacy']) is not None", bloqueante: true, desc: "dependencias y modelo de spaCy instalados"}
  - {id: S5, tipo: archivo_existe, ruta: estado/progreso.json, bloqueante: true, desc: "archivo de estado creado"}
  - {id: S6, tipo: python, expr: "all(k in cfg for k in ['proyecto', 'datos', 'limpieza', 'eda', 'indices', 'evaluacion'])", bloqueante: true, desc: "proyecto.yaml completo"}

descarga:
  - {id: D1, tipo: python, expr: "os.path.exists(cfg['datos']['ruta_raw'])", bloqueante: true, desc: "CSV obtenido"}
  - {id: D2, tipo: python, expr: "len(pd.read_csv(cfg['datos']['ruta_raw'])) == cfg['datos']['filas_esperadas']", bloqueante: true, desc: "filas esperadas"}
  - {id: D3, tipo: python, expr: "{cfg['datos']['columna_texto'], cfg['datos']['columna_categoria']} <= set(pd.read_csv(cfg['datos']['ruta_raw'], nrows=0).columns)", bloqueante: true, desc: "columnas de texto y categoría"}
  - {id: D4, tipo: python, expr: "set(pd.read_csv(cfg['datos']['ruta_raw'])[cfg['datos']['columna_categoria']]) == set(cfg['datos']['categorias'])", bloqueante: true, desc: "categorías esperadas"}
  - {id: D5, tipo: python, expr: "os.path.exists(os.path.splitext(cfg['datos']['ruta_raw'])[0] + '.sha256')", bloqueante: false, desc: "hash registrado"}
  - {id: D6, tipo: archivo_existe, ruta: reports/descarga.md, bloqueante: true, desc: "reporte de descarga"}

eda_raw:
  - {id: E1, tipo: archivo_existe, ruta: reports/eda_raw.md, bloqueante: true, desc: "reporte EDA raw"}
  - {id: E2, tipo: python, expr: "json.load(open('reports/eda_raw.json'))['n_duplicados'] == cfg['datos']['duplicados_esperados']", bloqueante: true, desc: "detectó los duplicados esperados"}
  - {id: E3, tipo: archivo_existe, ruta: reports/figuras/raw_categorias.png, bloqueante: true, desc: "gráfica de categorías"}
  - {id: E4, tipo: archivo_existe, ruta: reports/figuras/raw_longitudes.png, bloqueante: true, desc: "gráfica de longitudes"}

limpieza:
  - {id: L1, tipo: archivo_existe, ruta: data/processed/corpus_clean.csv, bloqueante: true, desc: "corpus limpio"}
  - {id: L2, tipo: python, expr: "cfg['limpieza']['filas_limpias']['min'] <= len(pd.read_csv('data/processed/corpus_clean.csv')) <= cfg['limpieza']['filas_limpias']['max']", bloqueante: true, desc: "duplicados quitados (filas en rango)"}
  - {id: L3, tipo: csv_columnas, ruta: data/processed/corpus_clean.csv, columnas: [doc_id, category, titulo, text_original, text_norm, tokens_lemma, tokens_stem, n_tokens], bloqueante: true, desc: "columnas en orden"}
  - {id: L4, tipo: csv_sin_nulos, ruta: data/processed/corpus_clean.csv, columnas: [doc_id, category, tokens_lemma], bloqueante: true, desc: "sin nulos"}
  - {id: L5, tipo: csv_sin_duplicados, ruta: data/processed/corpus_clean.csv, columna: text_original, bloqueante: true, desc: "sin textos duplicados"}
  - {id: L6, tipo: csv_sin_duplicados, ruta: data/processed/corpus_clean.csv, columna: doc_id, bloqueante: true, desc: "doc_id único"}
  - {id: L7, tipo: python, expr: "not pd.read_csv('data/processed/corpus_clean.csv').tokens_lemma.str.contains(r'\\d|[A-Z]|\\b(?:' + '|'.join(cfg['limpieza']['palabras_prohibidas']) + r')\\b').any()", bloqueante: true, desc: "sin dígitos, mayúsculas ni stopwords comunes"}
  - {id: L8, tipo: python, expr: "__import__('preprocesamiento').preprocesar(cfg['limpieza']['prueba']['entrada']) == cfg['limpieza']['prueba']['salida']", bloqueante: false, desc: "preprocesar() reutilizable y consistente"}
  - {id: L9, tipo: archivo_existe, ruta: reports/limpieza.md, bloqueante: true, desc: "reporte de limpieza"}

eda_corpus:
  - {id: C1, tipo: archivo_existe, ruta: reports/eda_corpus.md, bloqueante: true, desc: "reporte EDA corpus"}
  - {id: C2, tipo: python, expr: "cfg['eda']['zipf']['s_min'] <= json.load(open('reports/eda_corpus.json'))['zipf_s'] <= cfg['eda']['zipf']['s_max']", bloqueante: true, desc: "exponente de Zipf plausible"}
  - {id: C3, tipo: python, expr: "cfg['eda']['heaps']['beta_min'] <= json.load(open('reports/eda_corpus.json'))['heaps_beta'] <= cfg['eda']['heaps']['beta_max']", bloqueante: true, desc: "beta de Heaps plausible"}
  - {id: C4, tipo: python, expr: "json.load(open('reports/eda_corpus.json'))['heaps_r2'] >= cfg['eda']['heaps']['r2_min']", bloqueante: false, desc: "buen ajuste de Heaps"}
  - {id: C5, tipo: archivo_existe, ruta: reports/figuras/zipf.png, bloqueante: true, desc: "gráfica Zipf"}
  - {id: C6, tipo: archivo_existe, ruta: reports/figuras/heaps.png, bloqueante: true, desc: "gráfica Heaps"}
  - {id: C7, tipo: python, expr: "all(os.path.exists(f'reports/figuras/wordcloud_{c}.png') for c in ['global', *cfg['datos']['categorias']])", bloqueante: true, desc: "wordcloud global y una por categoría"}

indices:
  - {id: I1, tipo: python, expr: "all(os.path.exists(f'models/{f}') for f in ['count.pkl','tfidf.pkl','bm25.pkl','svd.pkl'])", bloqueante: true, desc: "4 índices obligatorios"}
  - {id: I2, tipo: python, expr: "all(os.path.exists(f'models/{f}') for f in ['w2v.model','w2v_docs.npy','lda.pkl'])", bloqueante: false, desc: "índices extra (W2V, LDA)"}
  - {id: I3, tipo: python, expr: "len(pd.read_csv('models/doc_index.csv')) == len(pd.read_csv('data/processed/corpus_clean.csv'))", bloqueante: true, desc: "mapeo fila→documento completo"}
  - {id: I4, tipo: python, expr: "all(__import__('buscar').buscar(cfg['indices']['consulta_rango'], m, 10).shape[0] == 10 for m in ['count','tfidf','bm25','svd'])", bloqueante: true, desc: "buscar() devuelve 10 resultados en los 4 métodos"}
  - {id: I5, tipo: python, expr: "(__import__('buscar').buscar(cfg['indices']['sanidad']['query'], cfg['indices']['sanidad']['metodo'], cfg['indices']['sanidad']['k']).category == cfg['indices']['sanidad']['categoria']).sum() >= cfg['indices']['sanidad']['minimo']", bloqueante: true, desc: "sanidad: la consulta de control trae su categoría"}
  - {id: I6, tipo: python, expr: "__import__('buscar').buscar(cfg['indices']['consulta_rango'], 'tfidf', 10).score.is_monotonic_decreasing", bloqueante: true, desc: "ranking ordenado descendente"}
  - {id: I7, tipo: archivo_existe, ruta: src/ingesta.py, bloqueante: true, desc: "pipeline de ingesta"}
  - {id: I8, tipo: archivo_existe, ruta: reports/ejemplos_busqueda.md, bloqueante: true, desc: "ejemplos de búsqueda"}

evaluacion:
  - {id: V1, tipo: archivo_existe, ruta: reports/metricas.csv, bloqueante: true, desc: "métricas agregadas"}
  - {id: V2, tipo: python, expr: "set(pd.read_csv('reports/metricas.csv').iloc[:,0]) >= {'count','tfidf','bm25','svd'}", bloqueante: true, desc: "los 4 métodos evaluados"}
  - {id: V3, tipo: python, expr: "pd.read_csv('reports/metricas.csv').select_dtypes('number').drop(columns=[c for c in pd.read_csv('reports/metricas.csv').columns if 'lat' in c.lower()], errors='ignore').apply(lambda s: s.between(0,1).all()).all()", bloqueante: true, desc: "métricas entre 0 y 1"}
  - {id: V4, tipo: python, expr: "pd.read_csv('data/processed/consultas.csv').query_id.nunique() >= cfg['evaluacion']['auto_por_categoria'] * len(cfg['datos']['categorias']) + sum(len(v) for v in cfg['evaluacion']['consultas_manuales'].values())", bloqueante: true, desc: "consultas automáticas + manuales completas"}
  - {id: V5, tipo: python, expr: "all(os.path.exists(f'reports/figuras/{f}') for f in ['eval_map_por_metodo.png','eval_heatmap_categoria.png','eval_latencia.png'])", bloqueante: true, desc: "gráficas de evaluación"}
  - {id: V6, tipo: archivo_existe, ruta: reports/evaluacion.md, bloqueante: true, desc: "reporte de evaluación"}

presentacion:
  - {id: P1, tipo: python, expr: "all(k in json.load(open('presentacion/estilo.json')) for k in ['paleta','tipografia'])", bloqueante: true, desc: "sistema de diseño propio documentado (paleta y tipografía)"}
  - {id: P2, tipo: archivo_existe, ruta: presentacion/salida/presentacion_final.pptx, bloqueante: true, desc: "presentación generada"}
  - {id: P3, tipo: python, expr: "len(__import__('pptx').Presentation('presentacion/salida/presentacion_final.pptx').slides) >= 12", bloqueante: true, desc: "al menos 12 diapositivas"}
  - {id: P4, tipo: python, expr: "not any(p.level>0 or (p.text.strip()[:1] in '•-*–' and p.text.strip()) for s in __import__('pptx').Presentation('presentacion/salida/presentacion_final.pptx').slides for sh in s.shapes if sh.has_text_frame for p in sh.text_frame.paragraphs)", bloqueante: true, desc: "sin viñetas"}
  - {id: P5, tipo: python, expr: "max(len(' '.join(sh.text_frame.text for sh in s.shapes if sh.has_text_frame).split()) for s in __import__('pptx').Presentation('presentacion/salida/presentacion_final.pptx').slides) <= 60", bloqueante: true, desc: "máx. 60 palabras por diapositiva"}
  - {id: P6, tipo: python, expr: "all(sh.left>=0 and sh.top>=0 and sh.left+sh.width<=prs.slide_width and sh.top+sh.height<=prs.slide_height for prs in [__import__('pptx').Presentation('presentacion/salida/presentacion_final.pptx')] for s in prs.slides for sh in s.shapes)", bloqueante: true, desc: "ninguna forma sale del lienzo"}
  - {id: P7, tipo: python, expr: "len([f for f in os.listdir('presentacion/salida/preview') if f.startswith('slide_')]) == len(__import__('pptx').Presentation('presentacion/salida/presentacion_final.pptx').slides)", bloqueante: true, desc: "una vista previa por diapositiva"}
  - {id: P8, tipo: python, expr: "json.load(open('presentacion/salida/revision_automatica.json')).get('errores', 1) == 0", bloqueante: true, desc: "revisión automática sin errores (desbordes, solapes, contraste, tamaños)"}
  - {id: P9, tipo: archivo_existe, ruta: presentacion/salida/revision_visual.md, bloqueante: true, desc: "revisión visual documentada"}
